name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash -n tdm install.sh update.sh uninstall.sh tests/test.sh
      - run: bash tests/test.sh
      - run: shellcheck -S error tdm install.sh update.sh uninstall.sh tests/test.sh
